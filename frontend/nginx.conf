server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: любой неизвестный путь (например /incidents/abc)
    # отдаёт index.html, а маршрутизацию делает React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хешированные ассеты Vite можно кэшировать надолго.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
