server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Main screen: the FixOps landing page at the site root.
    location = / {
        try_files /index.html =404;
    }

    # React dashboard SPA, mounted under /dashboard. Unknown paths inside
    # the dashboard (e.g. /dashboard/incidents/abc) fall back to its
    # index.html and are routed by React Router (basename /dashboard).
    location /dashboard {
        try_files $uri $uri/ /dashboard/index.html;
    }

    # Hashed Vite assets can be cached for a long time.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
