# Production-стек FixOps.
# Образы собираются в CI и публикуются в GHCR, здесь только запуск.
# Использование:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --remove-orphans
name: fixops

services:

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_NAME}
      - TZ=Europe/Moscow
    expose:
      - '5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis/redis-stack:latest
    container_name: redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  fixops:
    image: ghcr.io/${IMAGE_OWNER}/fixops-backend:${IMAGE_TAG:-latest}
    container_name: fixops
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # FixOps управляет Docker
      - /var/run/docker.sock:/var/run/docker.sock

      # Проекты для FixOps
      - /home/virtu/projects:/projects

      # Тот же путь внутри FixOps,
      # чтобы Docker Compose видел реальные host-пути
      - /home/virtu/projects:/home/virtu/projects

      # SSH для GitHub
      - /home/virtu/.ssh:/root/.ssh:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    image: ghcr.io/${IMAGE_OWNER}/fixops-frontend:${IMAGE_TAG:-latest}
    container_name: fixops-frontend
    restart: unless-stopped
    depends_on:
      - fixops
    ports:
      - "3000:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
  postgres-data:
