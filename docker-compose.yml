services:

  fixops:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: fixops

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - redis

    ports:
      - "8000:8000"

    volumes:
      # FixOps управляет Docker
      - /var/run/docker.sock:/var/run/docker.sock

      # Проекты для FixOps
      - /home/virtu/projects:/projects

      # Тот же путь внутри FixOps,
      # чтобы Docker Compose видел реальные host-пути
      - /home/virtu/projects:/home/virtu/projects

      # SSH для GitHub
      - /home/virtu/.ssh:/root/.ssh:ro-


  frontend:
    image: nginx:alpine

    container_name: fixops-frontend

    restart: unless-stopped

    depends_on:
      - fixops

    ports:
      - "3000:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro


  redis:
    image: redis/redis-stack:latest

    container_name: redis

    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}

    expose:
      - "6379"

    volumes:
      - redis-data:/data


volumes:
  redis-data:
