services:

  fixops:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: fixops

    restart: unless-stopped

    depends_on:
      - redis

    volumes:
      # FixOps наблюдает Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Git-репозитории проектов.
      # FixOps читает и изменяет файлы прямо здесь.
      - /home/virtu/projects:/projects


  redis:
    image: redis/redis-stack:latest

    container_name: redis

    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}

    expose:
      - "6379"

    volumes:
      - redis-data:/data


volumes:
  redis-data:
